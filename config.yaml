application:
  name: ZeeAIBotWebCam
  environment: development

hardware:
  mode: real
  vendor_path: vendor/TurboPi
  serial_device: /dev/ttyAMA0
  ultrasonic_enabled: true
  infrared_enabled: true
  motor_mapping_validated: false
  pan_tilt:
    enabled: false
    pan:
      channel: null
      center: 1500
      minimum: 1300
      maximum: 1700
      inverted: false
    tilt:
      channel: null
      center: 1500
      minimum: 1300
      maximum: 1700
      inverted: false

camera:
  enabled: true
  mode: mock
  required: false
  model_path: /usr/share/imx500-models/imx500_network_ssd_mobilenetv2_fpnlite_320x320_pp.rpk
  width: 1280
  height: 720
  frame_rate: 20
  confidence_threshold: 0.55
  jpeg_quality: 80
  person_label: person

web:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO

safety:
  motion_enabled: false
  minimum_obstacle_distance_cm: 30.0
  heartbeat_timeout_ms: 750
  control_lease_ttl_seconds: 10.0
  require_control_lease: true

privacy:
  recording_enabled: false
  face_recognition_enabled: false
