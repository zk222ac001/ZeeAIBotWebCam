name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HARDWARE_MODE: mock
      CAMERA_MODE: mock
      AUDIO_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=75" wheel
          pip install -e ".[dev,webrtc]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Tests
        run: pytest -v

      - name: Build distribution
        run: pip wheel --no-deps --wheel-dir dist .

      - name: Build release candidate
        if: matrix.python-version == '3.13'
        run: |
          python scripts/build_release.py --output dist
          for bundle in dist/zeeai-studio-*.tar.gz; do
            tar -xzf "$bundle" -C "$RUNNER_TEMP"
          done
          for release_folder in "$RUNNER_TEMP"/zeeai-studio-*; do
            python scripts/verify_release.py "$release_folder"
          done

  # Preserve the required branch-protection check across the Python matrix.
  test:
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Require all Python checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
